<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Storyteller animated demo">
  <defs>
    <filter id="c" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#A78BDA" flood-opacity="0.25"/>
    </filter>
    <style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="960" height="360" rx="20" fill="#FBF7FF"/>
  <!-- dot grid -->
  <g fill="#CDBDF0" opacity="0.45">
    <circle cx="80" cy="80" r="1.4"/><circle cx="180" cy="80" r="1.4"/><circle cx="280" cy="80" r="1.4"/><circle cx="380" cy="80" r="1.4"/><circle cx="480" cy="80" r="1.4"/><circle cx="580" cy="80" r="1.4"/><circle cx="680" cy="80" r="1.4"/><circle cx="780" cy="80" r="1.4"/><circle cx="880" cy="80" r="1.4"/>
    <circle cx="80" cy="180" r="1.4"/><circle cx="180" cy="180" r="1.4"/><circle cx="280" cy="180" r="1.4"/><circle cx="380" cy="180" r="1.4"/><circle cx="480" cy="180" r="1.4"/><circle cx="580" cy="180" r="1.4"/><circle cx="680" cy="180" r="1.4"/><circle cx="780" cy="180" r="1.4"/><circle cx="880" cy="180" r="1.4"/>
    <circle cx="80" cy="280" r="1.4"/><circle cx="180" cy="280" r="1.4"/><circle cx="280" cy="280" r="1.4"/><circle cx="380" cy="280" r="1.4"/><circle cx="480" cy="280" r="1.4"/><circle cx="580" cy="280" r="1.4"/><circle cx="680" cy="280" r="1.4"/><circle cx="780" cy="280" r="1.4"/><circle cx="880" cy="280" r="1.4"/>
  </g>

  <!-- edges -->
  <g stroke="#CDBDF0" stroke-width="2.5" fill="none">
    <path d="M150 110 C260 110 260 180 360 180"/>
    <path d="M510 180 C620 180 620 120 720 120"/>
    <path d="M510 180 C620 180 620 250 720 250"/>
  </g>

  <!-- node 1 -->
  <g filter="url(#c)"><rect x="60" y="82" width="180" height="56" rx="14" fill="#fff" stroke="#ECE3FA"/></g>
  <circle cx="80" cy="102" r="10" fill="#EBE2FB"/><text x="80" y="106" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#A78BDA">1</text>
  <text x="98" y="106" class="t" font-size="13" font-weight="700" fill="#3B3450">The Beginning</text>
  <text x="76" y="125" class="t" font-size="10.5" fill="#7C748F">Where it all starts…</text>

  <!-- node 2 -->
  <g filter="url(#c)"><rect x="360" y="152" width="150" height="56" rx="14" fill="#fff" stroke="#ECE3FA"/></g>
  <circle cx="380" cy="172" r="10" fill="#EBE2FB"/><text x="380" y="176" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#A78BDA">2</text>
  <text x="398" y="176" class="t" font-size="13" font-weight="700" fill="#3B3450">The Journey</text>
  <text x="376" y="195" class="t" font-size="10.5" fill="#7C748F">Trials and allies…</text>

  <!-- node 3 -->
  <g filter="url(#c)"><rect x="720" y="92" width="170" height="56" rx="14" fill="#fff" stroke="#ECE3FA"/></g>
  <circle cx="740" cy="112" r="10" fill="#EBE2FB"/><text x="740" y="116" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#A78BDA">3</text>
  <text x="758" y="116" class="t" font-size="13" font-weight="700" fill="#3B3450">The Twist</text>
  <text x="736" y="135" class="t" font-size="10.5" fill="#7C748F">Nothing is as it seemed…</text>

  <!-- node 4 -->
  <g filter="url(#c)"><rect x="720" y="222" width="170" height="56" rx="14" fill="#fff" stroke="#ECE3FA"/></g>
  <circle cx="740" cy="242" r="10" fill="#EBE2FB"/><text x="740" y="246" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#A78BDA">4</text>
  <text x="758" y="246" class="t" font-size="13" font-weight="700" fill="#3B3450">The Finale</text>
  <text x="736" y="265" class="t" font-size="10.5" fill="#7C748F">The story concludes…</text>

  <!-- traveling pulse ring (rests invisible if not animated) -->
  <rect x="55" y="77" width="190" height="66" rx="18" fill="none" stroke="#A78BDA" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="1.1s" begin="0s;8s" repeatCount="1"/>
  </rect>
  <rect x="355" y="147" width="160" height="66" rx="18" fill="none" stroke="#A78BDA" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="1.1s" begin="1.6s;9.6s" repeatCount="1"/>
  </rect>
  <rect x="715" y="87" width="180" height="66" rx="18" fill="none" stroke="#A78BDA" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="1.1s" begin="3.2s;11.2s" repeatCount="1"/>
  </rect>
  <rect x="715" y="217" width="180" height="66" rx="18" fill="none" stroke="#A78BDA" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="1.4s" begin="4.8s;12.8s" repeatCount="1"/>
  </rect>
</svg>
